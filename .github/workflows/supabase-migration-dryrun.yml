name: Supabase Migration Dry Run

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"

jobs:
  dry-run:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      - name: Dry run migration push
        id: dryrun
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set +e
          supabase db push --dry-run --yes > dryrun_output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat dryrun_output.txt

      - name: Comment dry-run result on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const output = fs.readFileSync("dryrun_output.txt", "utf8").trim();
            const exitCode = "${{ steps.dryrun.outputs.exit_code }}";
            const marker = "<!-- supabase-migration-dry-run -->";
            const status = exitCode === "0" ? "✅ dry-run 成功" : "❌ dry-run 失敗";

            const body = [
              marker,
              `### Supabase Migration Dry Run: ${status}`,
              "",
              "```",
              output || "(出力なし。適用待ちのマイグレーションはありません)",
              "```",
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job if dry-run failed
        if: steps.dryrun.outputs.exit_code != '0'
        run: exit 1
